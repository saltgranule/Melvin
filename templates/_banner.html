{# status banners for the whole site, kind is success, error, or misc #}
{% macro banner(kind, message, id=None, hidden=False) -%}
<div class="banner banner-{{ kind }}" role="{{ 'alert' if kind == 'error' else 'status' }}"
     {%- if id %} id="{{ id }}"{% endif %}{% if hidden %} hidden{% endif %}>{{ message }}</div>
{%- endmacro %}
