{% extends "base.html" %}
{% block content %}
<section class="hero">
    <div class="hero-text">
        <h1 class="hero-title">Melvin</h1>
        <p class="hero-subtitle">
            A discord.py app for moderation, utilities, and more. no-longer in
            beta. Support and <a href="{{ links.github }}">contributions</a>
            are welcome.
        </p>
        <div class="hero-cta">
            <a href="{{ links.invite }}" class="btn btn-primary">Add Melvin</a>
            <a href="{{ links.github }}" class="btn btn-dark">GitHub</a>
            <a href="/docs" class="docs-search">
                <svg class="docs-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="docs-search-input docs-search-fake-input">Search docs...</span>
                <kbd class="docs-search-kbd">/</kbd>
            </a>
        </div>
    </div>

    <div class="hero-logo-wrap">
        <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="hero-logo">
    </div>
</section>

<script>
    document.addEventListener("keydown", function (event) {
        var isTypingElsewhere = ["INPUT", "TEXTAREA"].indexOf(document.activeElement.tagName) !== -1;
        var isCmdK = (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k";
        var isSlash = event.key === "/" && !isTypingElsewhere;

        if (isCmdK || isSlash) {
            event.preventDefault();
            window.location.href = "/docs";
        }
    });
</script>
{% endblock %}
