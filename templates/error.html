{% extends "base.html" %}
{% block content %}
<section class="hero section-container">
    <div class="hero-text">
        <h1 class="hero-title">{{ code }}</h1>
        <p class="hero-subtitle">{{ message }}</p>
        <div class="hero-cta">
            <a href="{{ links.add }}" class="btn btn-primary">Add Melvin</a>
            <a href="{{ links.github }}" class="btn btn-dark">GitHub</a>
        </div>
    </div>

    <div class="hero-logo-wrap">
        <picture>
            <source srcset="{{ url_for('static', filename='media/melvin-logo-512.png') }}" media="(prefers-reduced-motion: reduce)">
            <img src="{{ url_for('static', filename='media/melvin-logo-wobble-440.webp') }}" alt="" class="hero-logo" width="440" height="440" loading="lazy">
        </picture>
    </div>
</section>
{% endblock %}
