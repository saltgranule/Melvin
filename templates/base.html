<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='media/MelvinLogo.png') }}">
    <style>
        :root {
            --primary: {{ theme.primary }};
            --secondary: {{ theme.secondary }};
            --tertiary: {{ theme.tertiary }};
            --quaternary: {{ theme.quaternary }};
        }
    </style>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Melvin">
    <meta property="og:description" content="Melvin is a community attempt to create a python based Discord bot from scratch. Melvin is entirely open sourced, and open to contributions.">
    <meta property="og:image" content="{{ url_for('static', filename='media/OG.jpg', _external=True) }}">
    <meta property="og:url" content="{{ request.url }}">
    <meta name="theme-color" content="{{ theme.primary }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Melvin">
    <meta name="twitter:description" content="Melvin is a community attempt to create a python based Discord bot from scratch. Melvin is entirely open sourced, and open to contributions.">
    <meta name="twitter:image" content="{{ url_for('static', filename='media/OG.jpg', _external=True) }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="navbar-logo">
        </a>
        <div class="navbar-links">
            <a href="/" class="navbar-link {{ 'is-active' if active == 'home' else '' }}">Home</a>
            <a href="/docs" class="navbar-link {{ 'is-active' if active == 'docs' else '' }}">Docs</a>
            <a href="/status" class="navbar-link {{ 'is-active' if active == 'status' else '' }}">Status</a>
        </div>
        <div class="navbar-actions">
            <a href="{{ links.github }}" class="navbar-github" aria-label="GitHub">
                <svg class="btn-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M208,104v8a48,48,0,0,1-48,48H136a32,32,0,0,1,32,32v40H104V192a32,32,0,0,1,32-32H112a48,48,0,0,1-48-48v-8a49.28,49.28,0,0,1,8.51-27.3A51.92,51.92,0,0,1,76,32a52,52,0,0,1,43.83,24h32.34A52,52,0,0,1,196,32a51.92,51.92,0,0,1,3.49,44.7A49.28,49.28,0,0,1,208,104Z" opacity="0.2"></path>
                    <path d="M208.3,75.68A59.74,59.74,0,0,0,202.93,28,8,8,0,0,0,196,24a59.75,59.75,0,0,0-48,24H124A59.75,59.75,0,0,0,76,24a8,8,0,0,0-6.93,4,59.78,59.78,0,0,0-5.38,47.68A58.14,58.14,0,0,0,56,104v8a56.06,56.06,0,0,0,48.44,55.47A39.8,39.8,0,0,0,96,192v8H72a24,24,0,0,1-24-24A40,40,0,0,0,8,136a8,8,0,0,0,0,16,24,24,0,0,1,24,24,40,40,0,0,0,40,40H96v16a8,8,0,0,0,16,0V192a24,24,0,0,1,48,0v40a8,8,0,0,0,16,0V192a39.8,39.8,0,0,0-8.44-24.53A56.06,56.06,0,0,0,216,112v-8A58,58,0,0,0,208.3,75.68ZM200,112a40,40,0,0,1-40,40H112a40,40,0,0,1-40-40v-8a41.74,41.74,0,0,1,6.9-22.48A8,8,0,0,0,80,73.83a43.81,43.81,0,0,1,.79-33.58,43.88,43.88,0,0,1,32.32,20.06A8,8,0,0,0,119.82,64h32.35a8,8,0,0,0,6.74-3.69,43.87,43.87,0,0,1,32.32-20.06A43.81,43.81,0,0,1,192,73.83a8.09,8.09,0,0,0,1,7.65A41.76,41.76,0,0,1,200,104Z"></path>
                </svg>
            </a>
            <a href="{{ links.invite }}" class="btn btn-primary">Add Melvin</a>
        </div>
    </nav>

    <main class="page-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-main">
            <div class="footer-brand-col">
                <a href="/" class="footer-brand">
                    <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="footer-logo">
                </a>
                <p class="footer-tagline">A discord.py bot for moderation, utilities, and more. No longer in beta.</p>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Site</h4>
                <a href="/" class="footer-link">Home</a>
                <a href="/docs" class="footer-link">Docs</a>
                <a href="/status" class="footer-link">Status</a>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Community</h4>
                <a href="{{ links.invite }}" class="footer-link">Support Server</a>
                <a href="{{ links.github }}" class="footer-link">GitHub</a>
            </div>
        </div>

        <div class="footer-bottom">
            <span>Melvin</span>
        </div>
    </footer>
</body>
</html>
