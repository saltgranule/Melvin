<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='media/MelvinLogo.png') }}">
    <style>
        :root {
            --primary: {{ theme.primary }};
            --secondary: {{ theme.secondary }};
            --tertiary: {{ theme.tertiary }};
            --quaternary: {{ theme.quaternary }};
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="navbar-logo">
        </a>
        <div class="navbar-links">
            <a href="/" class="navbar-link {{ 'is-active' if active == 'home' else '' }}">Home</a>
            <a href="/docs" class="navbar-link {{ 'is-active' if active == 'docs' else '' }}">Docs</a>
            <a href="https://github.com/saltgranule/Melvin" class="navbar-link">Github</a>
        </div>
        <button class="navbar-cta" type="button">Add Melvin</button>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
