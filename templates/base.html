<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melvin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='media/MelvinLogo.png') }}">
    <style>
        :root {
            --primary: {{ theme.primary }};
            --secondary: {{ theme.secondary }};
            --tertiary: {{ theme.tertiary }};
            --quaternary: {{ theme.quaternary }};
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="navbar-logo">
        </a>
        <div class="navbar-links">
            <a href="/" class="navbar-link {{ 'is-active' if active == 'home' else '' }}">Home</a>
            <a href="/docs" class="navbar-link {{ 'is-active' if active == 'docs' else '' }}">Docs</a>
            <a href="/status" class="navbar-link {{ 'is-active' if active == 'status' else '' }}">Status</a>
            <a href="{{ links.github }}" class="navbar-link">Github</a>
        </div>
            <a href="{{ links.invite }}" class="btn btn-primary">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M224,128a95.76,95.76,0,0,1-31.8,71.37A72,72,0,0,0,128,160a40,40,0,1,0-40-40,40,40,0,0,0,40,40,72,72,0,0,0-64.2,39.37h0A96,96,0,1,1,224,128Z" opacity="0.2"></path>
            <path d="M168,56a8,8,0,0,1,8-8h16V32a8,8,0,0,1,16,0V48h16a8,8,0,0,1,0,16H208V80a8,8,0,0,1-16,0V64H176A8,8,0,0,1,168,56Zm62.56,54.68a103.92,103.92,0,1,1-85.24-85.24,8,8,0,0,1-2.64,15.78A88.07,88.07,0,0,0,40,128a87.62,87.62,0,0,0,22.24,58.41A79.66,79.66,0,0,1,98.3,157.66a48,48,0,1,1,59.4,0,79.66,79.66,0,0,1,36.06,28.75A87.62,87.62,0,0,0,216,128a88.85,88.85,0,0,0-1.22-14.68,8,8,0,1,1,15.78-2.64ZM128,152a32,32,0,1,0-32-32A32,32,0,0,0,128,152Zm0,64a87.57,87.57,0,0,0,53.92-18.5,64,64,0,0,0-107.84,0A87.57,87.57,0,0,0,128,216Z"></path>
        </svg>
        Add Melvin
    </a>
    </nav>

    <main class="page-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-main">
            <div class="footer-brand-col">
                <a href="/" class="footer-brand">
                    <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="footer-logo">
                </a>
                <p class="footer-tagline">A discord.py bot for moderation, utilities, and more. No longer in beta.</p>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Site</h4>
                <a href="/" class="footer-link">Home</a>
                <a href="/docs" class="footer-link">Docs</a>
                <a href="/status" class="footer-link">Status</a>
            </div>

            <div class="footer-col">
                <h4 class="footer-heading">Community</h4>
                <a href="{{ links.invite }}" class="footer-link">Support Server</a>
                <a href="{{ links.github }}" class="footer-link">GitHub</a>
            </div>
        </div>

        <div class="footer-bottom">
            <span>Melvin</span>
        </div>
    </footer>
</body>
</html>
