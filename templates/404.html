{% extends "base.html" %}
{% block content %}
<section class="hero section-container">
    <div class="hero-text">
        <h1 class="hero-title">404</h1>
        <p class="hero-subtitle">
            That page doesn't exist. It might have moved, or the link is
            wrong.
        </p>
        <div class="hero-cta">
            <a href="{{ links.invite }}" class="btn btn-primary">Add Melvin</a>
            <a href="{{ links.github }}" class="btn btn-dark">GitHub</a>
            <a href="/docs" class="docs-search">
                <svg class="docs-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                    <path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="docs-search-input docs-search-fake-input">Search docs...</span>
                <kbd class="docs-search-kbd">/</kbd>
            </a>
        </div>
    </div>

    <div class="hero-logo-wrap">
        <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="Melvin" class="hero-logo">
    </div>
</section>
{% endblock %}
