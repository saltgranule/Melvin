{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block content %}
<section class="hero section-container">
    <div class="hero-text">
        <h1 class="hero-title">404</h1>
        <p class="hero-subtitle">
            That page doesn't exist. It might have moved, or the link is
            wrong.
        </p>
        <div class="hero-cta">
            <a href="{{ links.add }}" class="btn btn-primary">Add Melvin</a>
            <a href="{{ links.github }}" class="btn btn-dark">
            {{ icon("github-logo") }}
            GitHub
            </a>
            <a href="/docs" class="docs-search">
                {{ icon("magnifying-glass", 14, "docs-search-icon") }}
                <span class="docs-search-input docs-search-fake-input">Search docs...</span>
                <kbd class="docs-search-kbd">/</kbd>
            </a>
        </div>
    </div>

    <div class="hero-logo-wrap">
        <img src="{{ url_for('static', filename='media/MelvinLogo.png') }}" alt="" class="hero-logo">
    </div>
</section>
{% endblock %}
